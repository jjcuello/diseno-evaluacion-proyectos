<title>Propuestas de Trabajo de Grado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Layout: índice fijo a la izquierda en pantallas anchas; columna de lectura de ~70 caracteres; figuras y tablas pueden ensancharse. */
:root {
  --bg: #f4f7f7;
  --fg: #1b2428;
  --muted: #56646b;
  --rule: #d3dcdf;
  --panel: #e7eff0;
  --accent: #0b6e7f;
  --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  /*D-CLARO*/
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111719; --fg: #dde6e8; --muted: #9aabb1; --rule: #2b383c; --panel: #1a2427; --accent: #4fb3c2;
    /*D-OSCURO*/
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111719; --fg: #dde6e8; --muted: #9aabb1; --rule: #2b383c; --panel: #1a2427; --accent: #4fb3c2;
  /*D-OSCURO*/
  color-scheme: dark;
}

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.marco { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 80px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
@media (min-width: 1000px) { .marco { grid-template-columns: 220px minmax(0, 1fr); gap: 56px; } }

header.portada { grid-column: 1 / -1; border-bottom: 1px solid var(--rule); padding-bottom: 28px; }
.ceja { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
header h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 5vw, 44px); line-height: 1.1; margin: 0 0 14px; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14px; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }

nav.indice { font-size: 14px; }
nav.indice p { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
nav.indice ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
nav.indice li.n3 { padding-left: 14px; font-size: 13px; }
nav.indice a { color: var(--fg); text-decoration: none; }
nav.indice a:hover, nav.indice a:focus-visible { color: var(--accent); text-decoration: underline; }
@media (min-width: 1000px) { nav.indice { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; } }

article { min-width: 0; max-width: 46rem; }
article h2 { font-family: var(--font-display); font-size: 28px; line-height: 1.2; margin: 56px 0 16px; padding-top: 20px; border-top: 1px solid var(--rule); text-wrap: balance; scroll-margin-top: 20px; }
article h2:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
article h3 { font-family: var(--font-display); font-size: 22px; line-height: 1.25; margin: 40px 0 12px; text-wrap: balance; scroll-margin-top: 20px; }
article h4 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 36px 0 10px; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.3em; }
article li { margin: 4px 0; }
article li::marker { color: var(--muted); }
article a { color: var(--accent); }
article code { font-family: var(--font-mono); font-size: 0.88em; background: var(--panel); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
article hr { border: 0; margin: 0; }
article strong { font-weight: 600; }

article blockquote { margin: 20px 0; padding: 18px 22px; background: var(--panel); border-radius: 4px; }
article blockquote p { margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 1.35; }
article blockquote strong { display: block; font-family: var(--font-body); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

.tabla { overflow-x: auto; margin: 20px 0; border: 1px solid var(--rule); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
th { background: var(--panel); font-weight: 600; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; }

figure { margin: 28px 0; }
figure .lienzo { overflow-x: auto; padding: 16px; background: var(--panel); border-radius: 4px; }
figure svg { display: block; width: 100%; min-width: 620px; }
figcaption { font-size: 14px; color: var(--muted); margin-top: 10px; max-width: 68ch; }

li.tarea { list-style: none; position: relative; }
li.tarea::before { content: ""; position: absolute; left: -1.3em; top: 0.4em; width: 0.8em; height: 0.8em; border: 1.5px solid var(--muted); border-radius: 2px; }
</style>

<div class="marco">
  <header class="portada">
    <p class="ceja">Diseño y Evaluación de Proyectos · Politécnico Santiago Mariño</p>
    <h1>Propuestas de Trabajo de Grado</h1>
    <p class="meta"><span>José Javier Cuello Camargo</span><span>Borrador revisado con las orientaciones del docente</span><span>29 de septiembre de 2026</span></p>
  </header>
  <nav class="indice" aria-label="Contenido">
    <p>Contenido</p>
    <ol><!--INDICE--></ol>
  </nav>
  <article>
<!--CUERPO-->
  </article>
</div>
